  <g id="wordmark-layer" text-anchor="middle">
    <text id="brand-name-shadow" x="600" y="1055" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="168" font-weight="900" letter-spacing="12" fill="#F39A2C" stroke="#552415" stroke-width="36" stroke-linejoin="round">松鼠世界</text>
    <text id="brand-name" x="600" y="1037" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="168" font-weight="900" letter-spacing="12" fill="#FFF3CF" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">松鼠世界</text>
    <path id="wordmark-swoosh" d="M385 1102c137 38 287 38 430 0" fill="none" stroke="#19A78A" stroke-width="20" stroke-linecap="round"/>
    <circle cx="347" cy="1088" r="12" fill="#FFD65A"/>
