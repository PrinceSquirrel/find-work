      <path d="M430 620h438v70H430z" fill="#114E3E"/>
      <path d="M790 211a75 75 0 1 0 66 110 88 88 0 1 1-66-110z" fill="#FFD65A"/>
      <g id="stars" fill="#FFD65A">
        <path d="M686 222l10 24 24 10-24 10-10 24-10-24-24-10 24-10z"/>
        <path d="M885 365l8 19 19 8-19 8-8 19-8-19-19-8 19-8z"/>
