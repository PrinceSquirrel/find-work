      <path d="M401 585C246 412 302 149 512 77c203-70 439 32 514 233 72 190 6 403-151 507-110 74-260 82-370 26 118 3 222-52 276-144 59-101 53-233-20-324-76-94-205-132-320-91-125 45-195 170-166 301 15 66 56 128 126 171-61-26-106-82-124-148-2-8 1-17 8-23 34-28 82-28 116 0z" fill="url(#tail-orange)" stroke="#552415" stroke-width="28" stroke-linejoin="round"/>
