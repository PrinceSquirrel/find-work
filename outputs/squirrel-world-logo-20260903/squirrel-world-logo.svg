<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">松鼠世界原创 Logo</title>
  <desc id="logo-description">一只可爱松鼠环抱橡果形幻想星球，蓬松尾巴围成世界，搭配准确的中文名称松鼠世界。</desc>

  <defs>
    <linearGradient id="world-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B7169"/>
      <stop offset="1" stop-color="#0B3E3B"/>
    </linearGradient>
    <linearGradient id="tail-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#E85D2A"/>
    </linearGradient>
    <linearGradient id="planet-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8E76A"/>
      <stop offset="0.55" stop-color="#35B88B"/>
      <stop offset="1" stop-color="#168A88"/>
    </linearGradient>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#3A160B" flood-opacity="0.22"/>
    </filter>
    <filter id="small-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

